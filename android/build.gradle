buildscript {
  ext.CookieManagerConfig = [
    kotlinVersion: "2.0.21",
    minSdkVersion: 24,
    compileSdkVersion: 36,
    targetSdkVersion: 36,
    webkitVersion: "1.16.0"
  ]

  ext.getExtOrDefault = { prop ->
    if (rootProject.ext.has(prop)) {
      return rootProject.ext.get(prop)
    }

    return CookieManagerConfig[prop]
  }

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${getExtOrDefault('kotlinVersion')}"
  }
}


apply plugin: "com.android.library"
// AGP 9 ships built-in Kotlin support and registers the `kotlin` extension
// itself. Applying the Kotlin plugin on top of it fails configuration with
// "Cannot add extension with name 'kotlin'". Only apply it when nothing has
// registered that extension yet.
if (project.extensions.findByName('kotlin') == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

def configuredWebkitVersion =
  project.findProperty("react_native_cookie_manager_webkit_version")
    ?: rootProject.findProperty("react_native_cookie_manager_webkit_version")
def cookieManagerWebkitVersion =
  (configuredWebkitVersion ?: getExtOrDefault("webkitVersion")).toString()
def webkitVersionMatch =
  (cookieManagerWebkitVersion =~ /^(\d+)\.(\d+)\.(\d+)((?:[-+][0-9A-Za-z.-]+)?)$/)

if (!webkitVersionMatch.matches()) {
  throw new GradleException(
    "react_native_cookie_manager_webkit_version must be a full version such as 1.16.0 " +
      "(got '${cookieManagerWebkitVersion}')"
  )
}

def webkitVersionParts = [
  webkitVersionMatch.group(1).toInteger(),
  webkitVersionMatch.group(2).toInteger(),
  webkitVersionMatch.group(3).toInteger()
]
def webkitVersionSuffix = webkitVersionMatch.group(4)
def webkitVersionIsTooOld =
  webkitVersionParts[0] < 1 ||
    (webkitVersionParts[0] == 1 && webkitVersionParts[1] < 6) ||
    (webkitVersionParts == [1, 6, 0] && webkitVersionSuffix.startsWith("-"))

if (webkitVersionIsTooOld) {
  throw new GradleException(
    "AndroidX WebKit ${cookieManagerWebkitVersion} is unsupported; " +
      "@preeternal/react-native-cookie-manager requires 1.6.0 or newer"
  )
}

android {
  namespace "com.preeternal.reactnativecookiemanager"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")
    targetSdkVersion getExtOrDefault("targetSdkVersion")
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lint {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
  implementation "androidx.webkit:webkit:${cookieManagerWebkitVersion}"

  testImplementation "junit:junit:4.13.2"
}
